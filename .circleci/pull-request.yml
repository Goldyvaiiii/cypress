version: 2.1

orbs:
  node: circleci/node@7.1.1

executors:
  linux-x64:
    docker:
      - image: cypress/base-internal:22.15.1-bullseye
    environment:
      PLATFORM: linux
    resource_class: small

commands:
  prepare-environment:
    steps:
      - checkout
      - node/install-packages:
          pkg-manager: yarn
          with-cache: true
      - run: yarn build
      - persist_to_workspace:
          root: .
          paths: cypress

  use-prepared-env:
    steps:
      - attach_workspace:
          at: .

jobs:
  build:
    executor: linux-x64
    steps:
      - prepare-environment
  lint:
    executor: linux-x64
    steps:
      - use-prepared-env
      - run:
          name: Lint
          command: |
            lerna run lint

workflows:
  pull-request:
    jobs:
      - build
      - lint:
          requires:
            - build
