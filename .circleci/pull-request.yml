version: 2.1

orbs:
  node: circleci/node@7.1.1

executors:
  bullseye:
    docker:
      - image: node:22.15.1-bullseye-slim
    environment:
      PLATFORM: linux
    resource_class: medium

commands:
  prepare-environment:
    steps:
      - run:
          name: Checkout
          command: |
            git clone --depth 1 "$CIRCLE_REPOSITORY_URL" --branch "$CIRCLE_BRANCH" .
      - node/install-packages:
          pkg-manager: yarn
          with-cache: true
      - run: yarn build
      - persist_to_workspace:
          root: .
          paths:
            - cypress

  use-prepared-env:
    steps:
      - attach_workspace:
          at: .

jobs:
  build:
    executor: bullseye
    steps:
      - prepare-environment
  lint:
    executor: bullseye
    steps:
      - use-prepared-env
      - run:
          name: Lint
          command: |
            lerna run lint

workflows:
  pull-request:
    jobs:
      - build
      - lint:
          requires:
            - build
