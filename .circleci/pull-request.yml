version: 2.1

orbs:
  node: circleci/node@7.1.1

executors:
  linux-x64:
    docker:
      - image: cypress/base-internal:22.15.1-bullseye
    environment:
      PLATFORM: linux
    resource_class: medium

commands:
  install-packages:
    steps:
      - node/install-packages:
          pkg-manager: yarn
          with-cache: true
          cache-path: .yarn-cache
  build-repo:
    steps:
      - run:
          name: Patch and Build
          command: |
            yarn patch-package
            yarn gulp syncCloudValidations
            yarn nx run-many --target=build --all --exclude=root
            yarn nx run @packages/electron:build-binary
  prepare-environment:
    steps:
      - checkout
      - run: |
          yarn config set cache-folder .yarn-cache
          yarn config set prefer-offline true
      - install-packages
      - build-repo
      - persist_to_workspace:
          root: .
          paths:
            # Build artifacts and compiled code
            - packages/*/dist
            - packages/*/lib
            - packages/*/build
            - cli/lib
            - cli/dist
            # Configuration files
            - packages/*/package.json
            - packages/*/tsconfig.json
            - packages/*/cypress.config.*
            - cli/package.json
            - cli/tsconfig.json
            # Source files needed for linting
            - packages/*/src
            - cli/src
            # Root configuration
            - package.json
            - yarn.lock
            - tsconfig.json
            - nx.json
            - .eslintrc.*
            - cypress.config.*
  use-prepared-env:
    steps:
      - attach_workspace:
          at: .
      - install-packages

jobs:
  build:
    executor: linux-x64
    environment:
      - SKIP_POST_INSTALL: true
    steps:
      - prepare-environment
  lint:
    executor: linux-x64
    steps:
      - use-prepared-env
      - run:
          name: Lint
          command: |
            yarn nx run-many --target=lint --all

workflows:
  pull-request:
    jobs:
      - build
      - lint:
          requires:
            - build
