version: 2.1

orbs:
  node: circleci/node@7.1.1

executors:
  build-environment:
    machine:
      image: cypress/build-internal
      docker_layer_caching: true
    resource_class: medium

  bullseye:
    docker:
      - image: node:22.15.1-bullseye-slim
    environment:
      PLATFORM: linux
    resource_class: medium

commands:
  prepare-environment:
    steps:
      - checkout
      - run:
          name: Create Build Environment
          command: docker build -t cypress/build-internal ./.circleci/Dockerfile
      - node/install-packages:
          pkg-manager: yarn
          with-cache: true
      - run: yarn build
      - persist_to_workspace:
          root: .
          paths:
            - cypress

  use-prepared-env:
    steps:
      - attach_workspace:
          at: .

jobs:
  build:
    executor: build-environment
    steps:
      - prepare-environment
  lint:
    executor: bullseye
    steps:
      - use-prepared-env
      - run:
          name: Lint
          command: |
            lerna run lint

workflows:
  pull-request:
    jobs:
      - build
      - lint:
          requires:
            - build
