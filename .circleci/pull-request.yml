version: 2.1

orbs:
  node: circleci/node@7.1.1

executors:
  linux-x64:
    docker:
      - image: cypress/base-internal:22.15.1-bullseye
    environment:
      PLATFORM: linux
    resource_class: medium

commands:
  install-packages:
    steps:
      - run: |
          echo "SKIP_POST_INSTALL=true" >> $BASH_ENV
      - run: |
          npm i -g pnpm
      - node/install-packages:
          pkg-manager: pnpm
          with-cache: true
          cache-path: .pnpm-cache
      - run: |
            pnpm dlx patch-package
  ensure-typedefs:
    steps:
      - run:
          name: Ensure Type Definitions
          command: |
            pnpm nx run-many --target=ci:ensure-typedefs --all --parallel
  build-repo:
    steps:
      - run:
          name: Build
          command: |
            pnpm gulp syncCloudValidations
            pnpm nx run-many --target=build --all --exclude=root
            pnpm nx run @packages/electron:build-binary
  prepare-workspace:
    steps:
      - checkout
      - run: |
          yarn config set cache-folder .yarn-cache
          yarn config set prefer-offline true
      - install-packages
      - build-repo
      - persist_to_workspace:
          root: .
          paths:
            # Main build artifacts (dist directories)
            - "packages/*/dist/**"
            - "cli/*/dist/**"
            - "npm/*/dist/**"
            - "tooling/*/dist/**"
            # Build directories
            - "packages/*/build/**"
            - "packages/example/build/**"
            # Generated files
            - "packages/*/src/generated/**"
            - "packages/*/components.d.ts"
            - "system-tests/lib/**"
            # CLI build artifacts
            - "cli/lib/**"
            # Tooling artifacts
            - "tooling/*/bin/**"
            - "tooling/*/cache/**"
  ensure-workspace:
    steps:
      - checkout
      - install-packages
      - attach_workspace:
          at: /tmp/workspace
      - run: |
          if [ -d /tmp/workspace ] && [ "$(ls -A /tmp/workspace)" ]; then
            cp -r /tmp/workspace/* .
          else
            echo "No workspace to restore, continuing with fresh checkout"
          fi

jobs:
  lint:
    executor: linux-x64
    steps:
      - ensure-workspace
      - ensure-typedefs
      - run:
          name: Lint
          command: |
              pnpm run --recursive lint
  build:
    executor: linux-x64
    steps:
      - prepare-workspace
  unit-test:
    executor: linux-x64
    steps:
      - ensure-workspace
      - run:
          name: Unit Test
          command: |
            yarn nx run-many --target=ci:test:unit --all --parallel

workflows:
  pull-request:
    jobs:
      - lint
      #- build:
      #    requires:
      #      - lint
      #- unit-test:
      #    requires:
      #      - build
