version: 2.1

orbs:
  node: circleci/node@7.1.1

executors:
  linux-x64:
    docker:
      - image: cypress/base-internal:22.15.1-bullseye
    environment:
      PLATFORM: linux
    resource_class: medium

commands:
  install-packages:
    steps:
      - node/install-packages:
          pkg-manager: yarn
          with-cache: true
          cache-path: .yarn-cache
      - run: |
            yarn patch-package
  ensure-typedefs:
    steps:
      - run:
          name: Ensure Type Definitions
          command: |
            yarn nx run-many --target=ci:ensure-typedefs --all --parallel
  # build-repo:
  #   steps:
  #     - run:
  #         name: Build
  #         command: |
  #           yarn gulp syncCloudValidations
  #           yarn nx run-many --target=build --all --exclude=root
  #           yarn nx run @packages/electron:build-binary
  prepare-environment:
    steps:
      - checkout
      - run: |
          yarn config set cache-folder .yarn-cache
          yarn config set prefer-offline true
      - install-packages
#      - build-repo
      # - persist_to_workspace:
      #     root: .
      #     paths:
      #       # Main build artifacts (dist directories)
      #       - "packages/*/dist/**"
      #       - "cli/*/dist/**"
      #       - "npm/*/dist/**"
      #       - "tooling/*/dist/**"
      #       # Build directories
      #       - "packages/*/build/**"
      #       - "packages/example/build/**"
      #       # Generated files
      #       - "packages/*/src/generated/**"
      #       - "packages/*/components.d.ts"
      #       - "system-tests/lib/**"
      #       # CLI build artifacts
      #       - "cli/lib/**"
      #       # Tooling artifacts
      #       - "tooling/*/bin/**"
      #       - "tooling/*/cache/**"
  ensure-workspace:
    steps:
      - checkout
      - install-packages
      - attach_workspace:
          at: /tmp/workspace
      - run: |
          [ -d /tmp/workspace ] && cp -r /tmp/workspace/* .

jobs:
  # build:
  #   executor: linux-x64
  #   environment:
  #     - SKIP_POST_INSTALL: true
  #   steps:
  #     - prepare-environment
  lint:
    executor: linux-x64
    environment:
      - SKIP_POST_INSTALL: true
    steps:
      - ensure-workspace
      - ensure-typedefs
      - run:
          name: Lint
          command: |
              yarn nx run-many --target=lint --all --parallel

workflows:
  pull-request:
    jobs:
      - lint
