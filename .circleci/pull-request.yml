version: 2.1

orbs:
  node: circleci/node@7.1.1

executors:
  linux-x64:
    docker:
      - image: cypress/base-internal:22.15.1-bullseye
    environment:
      PLATFORM: linux
    resource_class: medium

commands:
  build-repo:
    steps:
      - run:
          name: Patch and Build
          command: |
            yarn patch-package
            yarn gulp syncCloudValidations
            yarn nx run-many --target=build --all --exclude=root
            yarn nx run @packages/electron:build-binary
  prepare-environment:
    steps:
      - checkout
      - run: |
          yarn config set cache-folder .yarn-cache
          yarn config set prefer-offline true
      - node/install-packages:
          pkg-manager: yarn
          with-cache: true
          cache-path: .yarn-cache
      - build-repo
      - persist_to_workspace:
          root: .
          paths:
            - .
  use-prepared-env:
    steps:
      - attach_workspace:
          at: .

jobs:
  build:
    executor: linux-x64
    environment:
      - SKIP_POST_INSTALL: true
    steps:
      - prepare-environment
  lint:
    executor: linux-x64
    steps:
      - use-prepared-env
      - run:
          name: Lint
          command: |
            yarn nx run-many --target=lint --all

workflows:
  pull-request:
    jobs:
      - build
      - lint:
          requires:
            - build
