        working_directory: /tmp/cypress-example-kitchensink
    - run:
        name: Example server
        command: yarn start
        working_directory: /tmp/cypress-example-kitchensink
        background: true
    - run:
        name: Run Kitchensink example project
        command: |
          yarn cypress:run --project /tmp/cypress-example-kitchensink

